name: Corregir nota Zamora — senador (no gobernador)

on:
  workflow_dispatch:

jobs:
  editar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Habilitar Node.js 24
        run: echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> $GITHUB_ENV

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Crear archivo .env desde secretos
        run: |
          cat > .env << EOF
          WP_URL=${{ secrets.WP_URL }}
          WP_USERNAME=${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD=${{ secrets.WP_APP_PASSWORD }}
          EOF

      - name: Corregir nota en WordPress
        run: python _editar_nota_zamora.py
